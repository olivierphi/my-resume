name: Static pages deployment

on:
  push:
    branches: ["django-version"]
  pull_request:
    branches: ["django-version"]

permissions:
  contents: write
  pages: write

jobs:
  tests:
    name: "Build and deploy"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v6"

      - uses: "actions/setup-python@v6"
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: "Install dependencies"
        run: uv sync --locked --all-extras --dev

      - name: "Build static pages, assets and PDFs"
        run: |
          make build-and-create-pdfs
        continue-on-error: false

      - name: "Add CNAME for Github Pages"
        run: echo "dunsap.com" > dist/CNAME

      - name: "Deploy to Github Pages"
        run: uv run -- ghp-import --no-history --push --force dist/
